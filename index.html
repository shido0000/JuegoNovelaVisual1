<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Academia Stellaris: Destinos Cruzados - Novela Visual Romántica" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Academia Stellaris: Destinos Cruzados</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a1a;
      }
      /* Splash screen */
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom, #1e1b4b, #3b0764, #0a0a1a);
        z-index: 9999;
        transition: opacity 0.5s;
      }
      .splash.hidden { opacity: 0; pointer-events: none; }
      .splash-text {
        color: #c4b5fd;
        font-family: Georgia, serif;
        font-size: 1.5rem;
        text-align: center;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" id="splash">
        <div class="splash-text">✨<br/>Academia Stellaris<br/><small>Cargando...</small></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Ocultar splash cuando React monte
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.classList.add('hidden');
          setTimeout(() => splash?.remove(), 500);
        }, 1000);
      });
    </script>
  </body>
</html>
